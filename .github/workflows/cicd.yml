# .github/workflows/cicd.yml
# (dev merge → 테스트/빌드 → 이미지 push → OIDC로 AWS 인증 → SSM으로 EC2 배포)

name: FE CI/CD (임시)

on:
  push:
    branches: ['deploy/**', 'feature/60']
# ---------- Dependencies Stage ----------
y
FROM node:24-alpine AS deps
WORKDIR /app

RUN corepack enable && corepack prepare pnpm@11.21.0 --activate

COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./

# husky는 git hook 설정 도구로 컨테이너에는 .git이 없어 prepare 스크립트가 실패함 → 비활성화
ENV HUSKY=0
RUN pnpm install --frozen-lockfile

# ---------- Build Stage ----------
FROM node:24-alpine AS builder
WORKDIR /app
RUN corepack enable && corepack prepare pnpm@11.21.0 --activate

COPY --from=deps /app/node_modules ./node_modules
COPY . .

# 값은 여기 적지 않고 빌드 명령의 --build-arg로 주입 (Git에 값이 올라가지 않도록)
# ARG로 선언한 값은 같은 스테이지의 RUN 실행 중 환경변수로 보이므로 ENV는 따로 필요 없음
# NEXT_PUBLIC_* 값은 next build 시점에 클라이언트 번들에 문자열로 치환됨
ARG NEXT_PUBLIC_KAKAO_REST_API_KEY
ARG NEXT_PUBLIC_KAKAO_REDIRECT_URI
ARG NEXT_PUBLIC_API_BASE_URL
ARG AUTH_COOKIE_DOMAIN

# next.config의 rewrites 등에서 빌드 때 API_BASE_URL을 쓰는 경우에만 주석 해제
ARG API_BASE_URL

RUN pnpm run build

# ---------- Runtime Stage ----------
FROM node:24-alpine AS runner
WORKDIR /app
ENV NODE_ENV=production

RUN addgroup -g 1001 -S nodejs && adduser -S nextjs -u 1001

COPY --from=builder /app/public ./public
COPY --from=builder --chown=nextjs:nodejs /app/.next/standalone ./
COPY --from=builder --chown=nextjs:nodejs /app/.next/static ./.next/static

USER nextjs
EXPOSE 3000
ENV PORT=3000
# 컨테이너 ID로 바인딩되는 것을 막고 모든 인터페이스(127.0.0.1 포함)에서 수신
ENV HOSTNAME=0.0.0.0


# 기본 권한은 최소화하고, 필요한 job에서만 개별 상향
permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/meety-fe

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          NEXT_PUBLIC_KAKAO_REST_API_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_REST_API_KEY }}
          NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_KAKAO_REDIRECT_URI }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      - name: Discord 알림 (빌드 실패)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"❌ [빌드 실패] ${{ github.repository }}\nBranch: ${{ github.ref_name }} (${{ github.sha }})\nAuthor: ${{ github.actor }}\nFailed Job: build\nError Message: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "${{ secrets.DISCORD_WEBHOOK_URL }}"

  docker-build:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - id: login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Discord 알림 (Docker Hub 인증 실패)
        if: failure() && steps.login.outcome == 'failure'
        run: |
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"❌ [Docker Hub 인증 실패] ${{ github.repository }}\nBranch: ${{ github.ref_name }} (${{ github.sha }})\nAuthor: ${{ github.actor }}\nFailed Job: docker-build(login)\nError Message: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "${{ secrets.DISCORD_WEBHOOK_URL }}"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          build-args: |
            NEXT_PUBLIC_KAKAO_REST_API_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_REST_API_KEY }}
            NEXT_PUBLIC_KAKAO_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_KAKAO_REDIRECT_URI }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Discord 알림 (이미지 빌드 실패)
        if: failure() && steps.push.outcome == 'failure'
        run: |
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"❌ [이미지 빌드 실패] ${{ github.repository }}\nBranch: ${{ github.ref_name }} (${{ github.sha }})\nAuthor: ${{ github.actor }}\nFailed Job: docker-build(push)\nError Message: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "${{ secrets.DISCORD_WEBHOOK_URL }}"

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # OIDC 토큰 발급(id-token)에 필요한 권한
    permissions:
      id-token: write
      contents: read
    # 동시에 두 배포가 같은 서버에 걸리지 않도록 직렬화 (진행 중인 배포는 취소하지 않음)
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}     # OIDC로 Assume할 IAM Role ARN (BE와 동일 Role 공유)
      INSTANCE_ID: ${{ secrets.APP_INSTANCE_ID }}   # app-v1-meety 의 Instance ID
      DEPLOY_DIR: ${{ secrets.APP_DEPLOY_DIR }}     # 서버의 docker-compose.yml 디렉터리
    steps:
      - name: 배포 시크릿 검증
        run: |
          [ -n "$AWS_ROLE_ARN" ] || { echo "::error::secrets.AWS_ROLE_ARN 이 비어 있습니다"; exit 1; }
          [ -n "$INSTANCE_ID" ]  || { echo "::error::secrets.APP_INSTANCE_ID 가 비어 있습니다"; exit 1; }
          [ -n "$DEPLOY_DIR" ]   || { echo "::error::secrets.APP_DEPLOY_DIR 이 비어 있습니다"; exit 1; }

      # GitHub OIDC 토큰으로 IAM Role을 Assume (장기 Access Key 미사용)
      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: gha-fe-deploy-${{ github.run_id }}
          role-skip-session-tagging: true

      - name: SSM 배포 명령 전송
        id: send
        run: |
          cat > remote.sh <<EOF
          #!/bin/bash
          set -euo pipefail
          cd "${DEPLOY_DIR}"

          # .env 의 이미지 태그를 갱신
          if grep -q '^FE_IMAGE_TAG=' .env; then
            sed -i "s|^FE_IMAGE_TAG=.*|FE_IMAGE_TAG=${IMAGE_TAG}|" .env
          else
            echo "FE_IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi

          # frontend 서비스만 새 이미지로 교체 (의존 서비스는 건드리지 않음)
          docker compose pull frontend
          docker compose up -d --no-deps --wait --wait-timeout 180 frontend

          docker image prune -f
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy frontend ${IMAGE_TAG} (run ${{ github.run_id }})" \
            --timeout-seconds 60 \
            --parameters "$(jq -Rs '{commands: split("\n"), executionTimeout: ["600"]}' remote.sh)" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: SSM 실행 결과 대기
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          STATUS="Pending"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          echo "::group::서버 stdout"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "::endgroup::"
          echo "::group::서버 stderr"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          echo "::endgroup::"

          echo "최종 상태: $STATUS"
          [ "$STATUS" = "Success" ] || { echo "::error::SSM 배포 실패 (status=$STATUS)"; exit 1; }

      - name: Discord 알림 (배포 실패)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"❌ [배포 실패] ${{ github.repository }}\nBranch: ${{ github.ref_name }} (${{ github.sha }})\nAuthor: ${{ github.actor }}\nFailed Job: deploy\nImage Tag: ${{ env.IMAGE_TAG }}\nError Message: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "${{ secrets.DISCORD_WEBHOOK_URL }}"
