name: FE CI/CD

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/meety-fe
  AWS_REGION: us-east-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # NEXT_PUBLIC_* 값은 이미지 빌드 때 필요하므로 빌드 job도 환경을 선택한다. 
    # 이 job 자체는 배포가 아니므로 GitHub Deployment 기록은 만들지 않는다.
    environment:
      name: ${{ github.ref_name == 'dev' && 'staging' || 'production' }}
      deployment: false

    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    env:
      NEXT_PUBLIC_KAKAO_REST_API_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_REST_API_KEY }}
      NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_KAKAO_REDIRECT_URI }}
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: 빌드 환경 확인
        run: |
          # 값은 출력하지 않고 필수 빌드 설정의 존재만 확인한다.
          [ -n "$NEXT_PUBLIC_KAKAO_REST_API_KEY" ] || {
            echo "::error::NEXT_PUBLIC_KAKAO_REST_API_KEY 누락"
            exit 1
          }
          [ -n "$NEXT_PUBLIC_KAKAO_REDIRECT_URI" ] || {
            echo "::error::NEXT_PUBLIC_KAKAO_REDIRECT_URI 누락"
            exit 1
          }
          [ -n "$NEXT_PUBLIC_API_BASE_URL" ] || {
            echo "::error::NEXT_PUBLIC_API_BASE_URL 누락"
            exit 1
          }

      # 전체 커밋 SHA를 태그로 사용해 배포 이미지를 정확히 식별한다.
      - id: tag
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: FE 이미지 빌드 및 게시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}

          # Dockerfile의 pnpm run build 단계에 환경별 공개 클라이언트 값을 전달한다.
          build-args: |
            NEXT_PUBLIC_KAKAO_REST_API_KEY=${{ env.NEXT_PUBLIC_KAKAO_REST_API_KEY }}
            NEXT_PUBLIC_KAKAO_REDIRECT_URI=${{ env.NEXT_PUBLIC_KAKAO_REDIRECT_URI }}
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_GA_ID=${{ env.NEXT_PUBLIC_GA_ID }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # dev는 새 스테이징 EC2, main은 기존 운영 EC2를 선택한다.
    environment:
      name: ${{ github.ref_name == 'dev' && 'staging' || 'production' }}

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: deploy-frontend-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      INSTANCE_ID: ${{ secrets.APP_INSTANCE_ID }}
      DEPLOY_DIR: ${{ secrets.APP_DEPLOY_DIR }}

    steps:
      - name: 배포 설정 확인
        run: |
          # 선택된 Environment의 배포 대상 값이 모두 있는지 확인한다.
          [ -n "$AWS_ROLE_ARN" ] || {
            echo "::error::AWS_ROLE_ARN 누락"
            exit 1
          }
          [ -n "$INSTANCE_ID" ] || {
            echo "::error::APP_INSTANCE_ID 누락"
            exit 1
          }
          [ -n "$DEPLOY_DIR" ] || {
            echo "::error::APP_DEPLOY_DIR 누락"
            exit 1
          }

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-fe-deploy-${{ github.run_id }}
          role-skip-session-tagging: true

      - name: SSM 배포 명령 전송
        id: send
        run: |
          # 선택된 서버에서 frontend 서비스만 새 이미지로 교체한다.
          cat > remote.sh <<EOF
          #!/bin/bash
          set -euo pipefail
          cd "${DEPLOY_DIR}"

          if grep -q '^FE_IMAGE_TAG=' .env; then
            sed -i "s|^FE_IMAGE_TAG=.*|FE_IMAGE_TAG=${IMAGE_TAG}|" .env
          else
            echo "FE_IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi

          docker compose pull frontend
          docker compose up -d --no-deps --wait --wait-timeout 180 frontend
          docker image prune -f
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy frontend ${IMAGE_TAG} (run ${{ github.run_id }})" \
            --timeout-seconds 60 \
            --parameters "$(jq -Rs '{commands: split("\n"), executionTimeout: ["600"]}' remote.sh)" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: SSM 실행 결과 대기
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          # 전송 직후 invocation이 아직 없을 수 있으므로 잠시 재시도한다.
          STATUS="Pending"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          # 서버 실행 결과를 Actions 로그에 남긴다.
          echo "::group::서버 stdout"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true
          echo "::endgroup::"

          echo "::group::서버 stderr"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true
          echo "::endgroup::"

          echo "최종 상태: $STATUS"
          [ "$STATUS" = "Success" ] || {
            echo "::error::SSM 배포 실패 (status=$STATUS)"
            exit 1
          }

  notify-failure:
    needs: [build-and-push, deploy]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest

    steps:
      - name: Discord 실패 알림
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 웹훅이 설정된 경우 실패한 실행 링크를 전송한다.
          [ -n "$WEBHOOK_URL" ] || exit 0
          jq -n \
            --arg repo "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg url "$RUN_URL" \
            '{content: ("❌ [FE CI/CD 실패] " + $repo + "\nBranch: " + $branch + "\n" + $url)}' |
            curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              --data-binary @- "$WEBHOOK_URL"